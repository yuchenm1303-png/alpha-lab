<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alpha Lab</title>
  <style>
    :root { font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; color-scheme: light; }
    body { margin: 0; background: #f5f7fa; color: #172033; }
    main { width: min(1100px, calc(100% - 32px)); margin: 40px auto 72px; }
    h1 { margin-bottom: 6px; font-size: 32px; }
    .muted { color: #667085; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; }
    .card { background: white; border: 1px solid #e6eaf0; border-radius: 16px; padding: 20px; box-shadow: 0 8px 24px rgba(16,24,40,.04); }
    label { display: block; margin: 12px 0 6px; font-size: 13px; color: #475467; }
    input, button { box-sizing: border-box; width: 100%; border-radius: 10px; border: 1px solid #d0d5dd; padding: 10px 12px; font: inherit; }
    button { border: 0; background: #172033; color: white; cursor: pointer; font-weight: 600; margin-top: 16px; }
    button.secondary { background: #eef2f6; color: #172033; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 16px; }
    .metric { background: #f8fafc; border-radius: 12px; padding: 14px; }
    .metric strong { display: block; font-size: 22px; margin-top: 4px; }
    table { width: 100%; border-collapse: collapse; margin-top: 14px; }
    th, td { text-align: right; padding: 12px 10px; border-bottom: 1px solid #edf0f3; }
    th:first-child, td:first-child { text-align: left; }
    .status { min-height: 22px; margin-top: 10px; font-size: 13px; color: #475467; }
    @media (max-width: 700px) { .stats { grid-template-columns: 1fr; } .row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<main>
  <h1>Alpha Lab</h1>
  <p class="muted">历史条件事件统计：换手率 × 人气排名 → 后续收益表现</p>

  <div class="grid">
    <section class="card">
      <h3>1. 导入日线数据</h3>
      <p class="muted">CSV 字段：symbol, trade_date, open, high, low, close, turnover_rate</p>
      <input id="barsFile" type="file" accept=".csv" />
      <button class="secondary" onclick="upload('/api/import/bars','barsFile','barsStatus')">导入日线</button>
      <div id="barsStatus" class="status"></div>
    </section>

    <section class="card">
      <h3>2. 导入历史人气</h3>
      <p class="muted">CSV 字段：symbol, trade_date, popularity_rank；可选 popularity_score</p>
      <input id="popFile" type="file" accept=".csv" />
      <button class="secondary" onclick="upload('/api/import/popularity','popFile','popStatus')">导入人气</button>
      <div id="popStatus" class="status"></div>
    </section>
  </div>

  <section class="card" style="margin-top:16px">
    <h3>3. 设置历史条件</h3>
    <div class="grid">
      <div>
        <label>开始日期</label><input id="startDate" type="date" />
        <label>结束日期</label><input id="endDate" type="date" />
      </div>
      <div>
        <label>换手率最小值 (%)</label><input id="turnoverMin" type="number" step="0.01" value="5" />
        <label>换手率最大值 (%)</label><input id="turnoverMax" type="number" step="0.01" value="15" />
      </div>
      <div>
        <label>人气排名最小值</label><input id="rankMin" type="number" value="1" />
        <label>人气排名最大值</label><input id="rankMax" type="number" value="30" />
      </div>
    </div>
    <button onclick="analyze()">开始统计</button>
    <div id="analysisStatus" class="status"></div>
  </section>

  <section class="card" style="margin-top:16px">
    <h3>统计结果</h3>
    <div class="stats">
      <div class="metric"><span class="muted">符合条件事件数</span><strong id="eventCount">—</strong></div>
      <div class="metric"><span class="muted">数据日线条数</span><strong id="barCount">—</strong></div>
      <div class="metric"><span class="muted">人气记录条数</span><strong id="popCount">—</strong></div>
    </div>
    <table>
      <thead><tr><th>未来交易日</th><th>有效样本</th><th>红盘率</th><th>平均涨幅</th><th>中位涨幅</th><th>波动</th></tr></thead>
      <tbody id="resultBody"><tr><td colspan="6" class="muted">导入数据后开始统计</td></tr></tbody>
    </table>
  </section>
</main>
<script>
  const fmt = value => value == null ? '—' : `${value.toFixed(2)}%`;
  const today = new Date();
  const yearAgo = new Date(today); yearAgo.setFullYear(today.getFullYear() - 1);
  document.getElementById('endDate').value = today.toISOString().slice(0,10);
  document.getElementById('startDate').value = yearAgo.toISOString().slice(0,10);

  async function upload(url, inputId, statusId) {
    const input = document.getElementById(inputId); const status = document.getElementById(statusId);
    if (!input.files.length) { status.textContent = '请先选择 CSV 文件'; return; }
    const form = new FormData(); form.append('file', input.files[0]);
    status.textContent = '导入中…';
    try {
      const res = await fetch(url, { method: 'POST', body: form }); const data = await res.json();
      if (!res.ok) throw new Error(data.detail || '导入失败');
      status.textContent = `已导入 ${data.imported_rows} 条记录`;
      await refreshStats();
    } catch (e) { status.textContent = e.message; }
  }

  async function refreshStats() {
    const res = await fetch('/api/data/stats'); const data = await res.json();
    document.getElementById('barCount').textContent = data.bars.toLocaleString();
    document.getElementById('popCount').textContent = data.popularity_rows.toLocaleString();
  }

  async function analyze() {
    const status = document.getElementById('analysisStatus'); status.textContent = '统计中…';
    const payload = {
      start_date: document.getElementById('startDate').value,
      end_date: document.getElementById('endDate').value,
      turnover_min: Number(document.getElementById('turnoverMin').value),
      turnover_max: Number(document.getElementById('turnoverMax').value),
      popularity_rank_min: Number(document.getElementById('rankMin').value),
      popularity_rank_max: Number(document.getElementById('rankMax').value),
      horizons: [1,3,5,10,20]
    };
    try {
      const res = await fetch('/api/analyze', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) });
      const data = await res.json(); if (!res.ok) throw new Error(data.detail?.[0]?.msg || data.detail || '统计失败');
      document.getElementById('eventCount').textContent = data.event_count.toLocaleString();
      document.getElementById('resultBody').innerHTML = data.stats.map(x => `<tr><td>${x.horizon} 日</td><td>${x.sample_count}</td><td>${fmt(x.positive_rate)}</td><td>${fmt(x.average_return)}</td><td>${fmt(x.median_return)}</td><td>${fmt(x.return_stddev)}</td></tr>`).join('');
      status.textContent = `完成：找到 ${data.event_count} 个历史事件`;
    } catch (e) { status.textContent = e.message; }
  }
  refreshStats();
</script>
</body>
</html>
